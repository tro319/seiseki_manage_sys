<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理者詳細画面 | 授業クラス管理システム</title>

<!-- CSS -->

<link rel="stylesheet" th:href="@{/css/style.css}" />



</head>
<body th:attr="data-manager-register-result=${manager_register_result}, data-manager-set-result=${manager_set_result}">
	
	
	<header th:replace="~{/manager/layouts/layout :: common_header_after}">
		

		
	</header>
	
	
	
	<main>
		
		<div class="page-main-tops">
			
			<div class="sub-title">
				
				<h2>管理者詳細画面</h2>
				
			</div>		
				
					
			<div class="sub-link">
				
<!--				<a th:href="@{/manager/majors}">専攻一覧へ</a>-->
				
			</div>	
				
	
		</div>
		

		
		<div class="container">
		
			
			<table class="table major-table border-off" th:object="${manager}">
				
				
				<tr>
					
					<td>管理者名</td>
					
					<td th:text="*{name}"></td>
					
				</tr>
				
				<tr>
					
					<td>ふりがな</td>
					
					<td th:text="*{kana}"></td>
					
				</tr>
				
				<tr>
					
					<td>メールアドレス</td>
					
					<td th:text="*{email}"></td>
					
				</tr>
				
				<tr>
					
					<td>パスワード</td>
					
					<td>表示されません</td>
					
				</tr>
				
			</table>
			
<!--			<div class="edit-links">-->
				
<!--				<a th:href="@{/manager/major_update(id=${major.id})}">更新</a>-->
<!--				<a th:href="@{/manager/major_delete(id=${major.id})}" onclick="return confirm('本当に削除しますか?');">削除</a>-->
				
<!--			</div>-->
			
			
		</div>
		
	</main>
	
	
	
	<footer th:replace="~{/manager/layouts/layout :: common_footer_after}">
		
	</footer>
	
	
	
	
	<!-- JS -->

	<script th:src="@{/js/original.js}"></script>



	
	
	<script>
		
		const registerResult = document.body.dataset.managerRegisterResult;
		
		const setResult = document.body.dataset.managerSetResult;
		
		if (registerResult) window.alert(registerResult);
		
		if (setResult) window.alert(setResult);
		
		
	</script>

</body>
</html>
