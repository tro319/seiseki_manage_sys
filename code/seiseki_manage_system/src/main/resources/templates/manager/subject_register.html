<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教科登録画面 | 授業クラス管理システム</title>

<!-- CSS -->
<link rel="stylesheet" th:href="@{/css/style.css}" />


<!-- JS -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script type="text/javascript" th:src="@{/js/jquery.autoKana.js}"></script>

<!-- ふりがな自動入力処理 -->

<script type="text/javascript">
	
	$(function() {
		$.fn.autoKana("#name", "#kana");
	});
	
</script>

</head>
<body>
	
	
	
	<header th:replace="~{/manager/layouts/layout :: common_header_after}">
		

		
	</header>
	
	
	
	<main>
		
		<div class="page-main-tops">
			
			<div class="sub-title">
				
				<h2>教科登録画面</h2>
				
			</div>		
				
					
			<div class="sub-link">
				
<!--				<a th:href=""></a>-->
				
			</div>	
				
	
		</div>
		

		
		<div class="container">
		
			
			<p class="err" th:text="${subject_register_result}"></p>
			
			<form method="post" th:action="@{/manager/subject_register}" class="form subject-register-form" th:object="${subject_register_data}">
				
				
				<div>
					
					<label for="name">教科名</label>
						
					<input type="text" th:field="*{name}" maxlength="30" required />
					
				</div>
				
				<div>
					
					<label for="kana">ふりがな</label>
					
					<input type="text" th:field="*{kana}" maxlength="50" required />
					
				</div>
				
				
				<div class="submit-btns">
					
					<input type="submit" value="登録" />
					
				</div>
				
				
			</form>
			
			
		</div>
		
	</main>
	
	
	
	<footer th:replace="~{/manager/layouts/layout :: common_footer_after}">
		
	</footer>
	
	
	
	<!-- JS -->

	<script th:src="@{/js/original.js}"></script>



	
	
	

</body>
</html>
