<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クラス一覧画面 | 成績管理システム</title>

<!-- CSS -->

<link rel="stylesheet" th:href="@{/css/style.css}" />



</head>
<body th:attr="data-class-delete-result=${class_delete_result}">
	
	
	
	<header th:replace="~{/manager/layouts/layout :: common_header_after}">
		

		
	</header>
	
	
	
	<main>
		
		<div class="page-main-tops">
			
			<div class="sub-title">
				
				<h2>クラス一覧画面</h2>
				
			</div>		
				
					
			<div class="sub-link add-link">
				
				<a th:href="@{/manager/class_register}">クラス追加へ</a>
				
			</div>	
				
	
		</div>
		

		
		<div class="container">
		
			
			<div class="border-table-cover">
			
				<table class="table border-on classess-table">
					
					<thead>
						
						<tr>
							
							<th>入学年度</th>
							
							<th>専攻名</th>
							
							<th></th>
							
						</tr>
						
					</thead>
					
					<tbody>
						
						<tr th:if="${!#lists.isEmpty(classes)}" th:each="class_info : ${classes}">
							
							<td th:text="${class_info.startYear}"></td>
							
							<td th:text="${class_info.major.name}"></td>
							
							<td><a th:href="@{/manager/class(id=${class_info.id})}">詳細</a></td>
							
						</tr>
						
					</tbody>
	
					
				</table>
			
			</div>
			
			
		</div>
		
	</main>
	
	
	
	<footer th:replace="~{/manager/layouts/layout :: common_footer_after}">
		
	</footer>
	
	
	<!-- JS -->

	<script th:src="@{/js/original.js}"></script>

	
	
	
	<script>
		
		const deleteResult = document.body.dataset.classDeleteResult;
		
		if (deleteResult) window.alert(deleteResult);
		
		
		
	</script>

</body>
</html>
