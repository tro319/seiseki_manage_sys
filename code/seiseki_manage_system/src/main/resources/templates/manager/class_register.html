<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クラス登録画面 | 成績管理システム</title>
<link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
	
	<main>
		
		<div class="page-main-tops">
			
			<div class="sub-title">
				
				<h2>クラス登録画面</h2>
				
			</div>		
				
					
			<div class="sub-link">
				
<!--				<a th:href=""></a>-->
				
			</div>	
				
	
		</div>
		

		
		<div class="container">
		
			
			<p class="err" th:text="${class_register_result}"></p>
			
			<form method="post" th:action="@{/manager/class_register}" class="form class-register-form" th:object="${class_register_data}">
				
				
				<div>
					
					<label for="startYear">入学年度</label>
						
					<input type="text" th:field="*{startYear}" maxlength="10" required />
					
				</div>
				
				<div>
					
					<label for="majorName">専攻名</label>
					
					<select th:field="*{majorName}">
						
						<option th:each="major : ${major_all}" th:value="${major.name}" th:text="${major.name}"></option>
						
					</select>
				
					
				</div>
				
				<div class="submit-btns">
					
					<input type="submit" value="登録" />
					
				</div>
				
				
			</form>
			
			
		</div>
		
	</main>
	
	<script>
		

		
	</script>

</body>
</html>
